[project]
name = "api"
version = "0.1.0"
description = "FastAPI 백엔드 — SHG 템플릿"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic-settings>=2.9",
    # 공공데이터 API 호출에 런타임으로 필요하다. dev 그룹에 두면 프로덕션
    # 이미지의 uv sync에서 빠져 동기화가 죽는다.
    "httpx>=0.28",
    # 비밀번호 해시. PHC 우승 알고리즘이고 기본 파라미터가 안전한 쪽이다 (ADR 008)
    "argon2-cffi>=23.1",
    # EmailStr 검증에 필요하다. 형식이 틀린 이메일로 가입되면 나중에
    # 비밀번호 재설정 메일이 닿지 않는다.
    "email-validator>=2.2",
    # AI 코스 생성 (ADR 009). 키가 없으면 스텁이 대신 응답하므로
    # 개발·테스트에서는 호출되지 않는다.
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "aiosqlite>=0.21",
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
packages = ["app"]

[tool.coverage.run]
# SQLAlchemy asyncio는 greenlet 위에서 돈다. 기본 추적기는 greenlet 안에서
# 실행된 줄을 놓쳐 서비스 레이어가 실제보다 낮게 측정된다 (auth 서비스가
# 테스트를 다 지나는데도 60%로 나왔다).
concurrency = ["thread", "greenlet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 커버리지 하한선 래칫 — 현재 99%, 하락만 막고 테스트가 늘면 올린다
addopts = "--cov=app --cov-report=term-missing --cov-report=xml:coverage/coverage.xml --cov-fail-under=95"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
