[project]
name = "api"
version = "0.1.0"
description = "FastAPI 백엔드 — SHG 템플릿"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic-settings>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "httpx>=0.28",
    "aiosqlite>=0.21",
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 커버리지 하한선 래칫 — 현재 89%, 하락만 막고 테스트가 늘면 올린다
addopts = "--cov=app --cov-report=term-missing --cov-report=xml:coverage/coverage.xml --cov-fail-under=85"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
