# =============================================================================
# docker-compose.yml — 로컬 개발용 인프라
#
# 사용법:
#   docker compose up -d        # Postgres 시작
#   docker compose down         # 중지 (데이터 유지)
#   docker compose down -v      # 중지 + 데이터 삭제
#
# 앱(web/api)은 pnpm dev로 호스트에서 실행하고, DB만 컨테이너로 띄웁니다.
# 로컬 전용 오버라이드는 docker-compose.override.yml 사용 (gitignore됨).
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: shg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
