databases:
  - name: ongangreung-db
    plan: free
    databaseName: ongangreung
    user: ongangreung

services:
  - type: web
    name: ongangreung-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # preDeployCommand는 free 플랜에서 지원하지 않는다. 대신 컨테이너
    # 시작 커맨드 자체에 마이그레이션·시드를 앞세운 start.sh를 가리킨다.
    # (인라인 "sh -c '...&&...'" 문자열은 Render가 따옴표를 셸 인자
    # 구분자로 해석하지 않고 통째로 한 커맨드 이름으로 봐서
    # "File name too long"으로 죽었다.) alembic upgrade는 이미 최신이면
    # 없는 일이고, seed_* 스크립트는 기본값이 "없는 것만 추가"라 매
    # 시작마다 실행해도(자유 티어는 유휴 시 슬립 후 재기동한다) 중복이
    # 생기지 않는다. Dockerfile의 CMD(마이그레이션과 분리된 uvicorn 단독
    # 실행)를 여기서 덮어쓴다.
    dockerCommand: ./start.sh
    envVars:
      # Render가 주는 connectionString은 postgresql:// 스킴이라 그대로면
      # asyncpg 드라이버와 안 맞는다. Settings.database_url의 field_validator
      # (app/core/config.py)가 자동으로 postgresql+asyncpg://로 바꾼다.
      - key: DATABASE_URL
        fromDatabase:
          name: ongangreung-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://on-gang-reung-web.vercel.app,https://on-gang-reung-web-vagus3s-projects.vercel.app
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TOURAPI_SERVICE_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
