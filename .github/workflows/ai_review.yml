name: Claude Review


on:
  pull_request:
    types:
      - opened
      - synchronize


permissions:
  contents: read
  pull-requests: write


jobs:

  review:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout

        uses: actions/checkout@v4


      - name: Claude Review

        uses: anthropics/claude-code-action@v1

        with:

          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          prompt: |

            Review this pull request.

            Follow:
            - .ai/core/CLAUDE.md
            - .ai/rules/REVIEW.md
            - .ai/rules/ARCHITECTURE.md


            Check:

            1. Bugs
            2. Security problems
            3. Performance
            4. Type safety
            5. Bad architecture
            6. Duplicate logic


            Leave GitHub PR comments.